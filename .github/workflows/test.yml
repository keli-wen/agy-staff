name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check:pi
      - run: npm test
  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix "$RUNNER_TEMP/pi" --ignore-scripts @earendil-works/pi-coding-agent@0.84.4
      - run: npm run test:pi
        env:
          AGY_PI_PACKAGE_ROOT: ${{ runner.temp }}/pi/node_modules/@earendil-works/pi-coding-agent
