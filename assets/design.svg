<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 448" role="img" aria-labelledby="title description">
  <title id="title">Task orchestration with AGY.</title>
  <desc id="description">Your agent in Claude Code, Codex, or Pi uses agy:lead to plan, delegate, review, and deliver. Assignments and feedback go to AGY staff, and results and evidence return. Staffer is the default worker; researcher, reviewer, and implementer are specialists used when helpful. Ask is for smoke tests.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="0.7" fill="#DADFE7"/></pattern>
    <marker id="out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#2670E8"/></marker>
    <marker id="back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#8560BA"/></marker>
  </defs>
