  <!-- 图例 -->
  <rect x="48" y="380" width="824" height="42" rx="10" fill="#EBDBBC" stroke="#DEDACE" stroke-width="1"/>
  <text x="460" y="406" font-size="13.5" text-anchor="middle"><tspan font-weight="700" fill="#CC785C">strict</tspan> = fail-closed 只读 allowlist&#160;&#160;&#160;&#160;|&#160;&#160;&#160;&#160;<tspan font-weight="700" fill="#BF4D43">loose</tspan> = 可写 &#183; 需干净 git 树 + diff 审查</text>
