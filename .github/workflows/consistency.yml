name: Generated skills consistency
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  consistency:
    name: Generated skills consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:pi
